<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandarin Room - You First Idiomas</title>
    <style>
        :root {
            --bg-dark: #0f0112;
            --panel-bg: #1a011f;
            --accent-yellow: #fff176;
            --mirror: #af8b4a;
            --danger-red: #ef4444;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg-dark); color: white; 
            font-family: 'Segoe UI', Tahoma, "PingFang SC", "Microsoft YaHei", sans-serif; overflow: hidden; 
        }

        .app-container { 
            display: grid; grid-template-rows: 1fr 230px; 
            height: 100vh; width: 100vw; 
        }

        /* Área de Vídeo */
        .video-wrapper { position: relative; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }

        /* Painel de Ferramentas com 3 Colunas */
        .tools-panel { 
            background: var(--panel-bg); border-top: 2px solid #333; 
            display: grid; grid-template-columns: 2fr 1fr 1fr; 
            gap: 12px; padding: 12px; box-sizing: border-box; 
        }

        .panel-box { 
            background: rgba(255,255,255,0.03); border-radius: 10px; 
            display: flex; flex-direction: column; overflow: hidden; 
            border: 1px solid #333; position: relative; padding: 10px; box-sizing: border-box;
        }

        .panel-header { 
            color: var(--accent-yellow); font-weight: bold; font-size: 11px; 
            text-transform: uppercase; margin-bottom: 8px; border-bottom: 1px solid #444; 
            padding-bottom: 4px; display: flex; justify-content: space-between; align-items: center;
        }

        /* Botão Copiar nas Notas */
        .copy-btn {
            background: rgba(255,255,255,0.1); border: 1px solid #555;
            color: var(--accent-yellow); font-size: 10px; padding: 2px 6px;
            border-radius: 4px; cursor: pointer; text-transform: uppercase; transition: 0.2s;
        }
        .copy-btn:hover { background: var(--accent-yellow); color: #000; }

        /* Controle do Microfone */
        .control-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 4px 8px; background: rgba(0,0,0,0.2); border-bottom: 1px solid #333; margin-bottom: 8px;
        }

        .status-tag { font-size: 10px; color: #aaa; display: flex; align-items: center; gap: 6px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: #666; display: inline-block; }
        .status-dot.active { background-color: #22c55e; box-shadow: 0 0 6px #22c55e; }

        #toggle-mic-btn {
            background: var(--accent-yellow); border: 1px solid var(--accent-yellow);
            color: #000; font-weight: bold; font-size: 10px; padding: 4px 8px;
            border-radius: 4px; cursor: pointer; text-transform: uppercase; transition: 0.3s;
        }
        #toggle-mic-btn.recording { background: var(--danger-red); border-color: var(--danger-red); color: #ffffff; }

        #scroll-area { flex-grow: 1; overflow-y: auto; padding: 5px; display: flex; flex-direction: column; gap: 8px; }
        .phrase-row { font-size: 22px; line-height: 1.3; letter-spacing: 1px; }
        .local { color: #ffffff; }
        .remote { color: var(--mirror); border-left: 3px solid var(--mirror); padding-left: 8px; }

        /* Conversor Pinyin para Hanzi */
        .pinyin-input-box {
            width: 100%; padding: 8px; background: rgba(0,0,0,0.4); border: 1px solid #444;
            color: var(--accent-yellow); font-size: 14px; border-radius: 4px; outline: none; margin-bottom: 8px; box-sizing: border-box;
        }
        .hanzi-candidates { display: flex; flex-wrap: wrap; gap: 6px; overflow-y: auto; flex-grow: 1; max-height: 110px; }
        .candidate-item {
            background: rgba(255, 241, 118, 0.1); border: 1px solid #555; color: #fff;
            padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 18px; transition: 0.2s;
        }
        .candidate-item:hover { background: var(--accent-yellow); color: #000; }

        /* Bloco de Notas Sincronizado */
        #shared-notes {
            width: 100%; height: 100%; background: transparent; border: none;
            color: #fff; font-size: 22px; line-height: 1.5; resize: none; outline: none;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Vídeo com a Sala Whereby -->
    <div class="video-wrapper">
        <iframe src="https://whereby.com/yfiworkshop" allow="camera; microphone; fullscreen; speaker; display-capture" allowfullscreen></iframe>
    </div>

    <!-- Painel Inferior Sincronizado -->
    <div class="tools-panel">
        <!-- Coluna 1: Legendas por Voz em Tempo Real -->
        <div class="panel-box">
            <div class="control-bar">
                <div class="status-tag">
                    <span id="statusDot" class="status-dot"></span>
                    <span id="statusText">DESATIVADO</span>
                </div>
                <button id="toggle-mic-btn" onclick="toggleListening()">ATIVAR [ESPAÇO]</button>
            </div>
            <div id="scroll-area">
                <div id="init-msg" style="color: var(--accent-yellow); font-size: 12px;">Pressione <kbd>Espaço</kbd> para ouvir o Chinês Mandarim...</div>
            </div>
        </div>

        <!-- Coluna 2: Conversor Pinyin -> Hanzi -->
        <div class="panel-box">
            <div class="panel-header">Teclado Pinyin (Hanzi)</div>
            <input type="text" id="pinyinInput" class="pinyin-input-box" placeholder="Digite Pinyin (ex: nihao, zh...)" oninput="convertPinyin()">
            <div id="candidates" class="hanzi-candidates"></div>
        </div>

        <!-- Coluna 3: Bloco de Notas Espelhado / Compartilhado -->
        <div class="panel-box">
            <div class="panel-header">
                <span>Anotações</span>
                <button class="copy-btn" onclick="copyNotes()">Copiar</button>
            </div>
            <textarea id="shared-notes" placeholder="Resultados um abaixo do outro..." oninput="syncNotes()"></textarea>
        </div>
    </div>
</div>

<script>
    // Configuração do Espelhamento (Firebase Realtime DB)
    const DB_URL = "https://chat-tool-d26fd-default-rtdb.firebaseio.com/live_session_mandarin.json";
    const myID = "USER_ZH_" + Math.random().toString(36).substring(7);
    let lastTimestamp = 0;

    async function sync(text, type) {
        const payload = { text, type, sender: myID, timestamp: Date.now() };
        try {
            await fetch(DB_URL, { method: 'PATCH', body: JSON.stringify({ "lastEvent": payload }) });
        } catch (e) {}
    }

    setInterval(async () => {
        try {
            const res = await fetch(DB_URL);
            const data = await res.json();
            if (data?.lastEvent) {
                const ev = data.lastEvent;
                if (ev.timestamp > lastTimestamp && ev.sender !== myID) {
                    lastTimestamp = ev.timestamp;
                    renderRemote(ev);
                }
            }
        } catch (e) {}
    }, 1200);

    function renderRemote(data) {
        if (data.type === 'phrase') {
            const row = document.createElement('div');
            row.className = 'phrase-row remote';
            row.innerText = data.text;
            const scrollArea = document.getElementById('scroll-area');
            scrollArea.appendChild(row);
            scrollArea.scrollTop = scrollArea.scrollHeight;
            const initMsg = document.getElementById('init-msg');
            if (initMsg) initMsg.style.display = 'none';
        } else if (data.type === 'notes') {
            document.getElementById('shared-notes').value = data.text;
        }
    }

    // Reconhecimento de Voz (Mandarim zh-CN)
    const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;

    const toggleBtn = document.getElementById('toggle-mic-btn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const scrollArea = document.getElementById('scroll-area');

    if (Speech) {
        recognition = new Speech();
        recognition.lang = 'zh-CN';
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onstart = () => {
            isListening = true;
            toggleBtn.innerText = "PARAR [ESPAÇO]";
            toggleBtn.classList.add("recording");
            statusDot.classList.add("active");
            statusText.innerText = "OUVINDO...";
        };

        recognition.onend = () => {
            isListening = false;
            toggleBtn.innerText = "ATIVAR [ESPAÇO]";
            toggleBtn.classList.remove("recording");
            statusDot.classList.remove("active");
            statusText.innerText = "DESATIVADO";
        };

        recognition.onresult = (e) => {
            for (let i = e.resultIndex; i < e.results.length; ++i) {
                if (e.results[i].isFinal) {
                    const text = e.results[i][0].transcript.trim();
                    const row = document.createElement('div');
                    row.className = 'phrase-row local';
                    row.innerText = text;
                    scrollArea.appendChild(row);
                    scrollArea.scrollTop = scrollArea.scrollHeight;
                    const initMsg = document.getElementById('init-msg');
                    if (initMsg) initMsg.style.display = 'none';
                    sync(text, 'phrase');
                }
            }
        };
    }

    function toggleListening() {
        if (!recognition) return;
        if (isListening) { recognition.stop(); } 
        else { try { recognition.start(); } catch (err) {} }
    }

    document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.code === 'Space') {
            e.preventDefault();
            toggleListening();
        }
    });

    // Dicionário Ampliado de Pinyin (Soporta búsqueda por prefijos como 'zh', 'ni', etc.)
    const pinyinDict = {
        "n": ["你", "呢", "那", "哪", "您"],
        "ni": ["你", "您"],
        "nih": ["你好"],
        "nihao": ["你好"],
        "l": ["老师", "零", "两", "来", "乐"],
        "lao": ["老", "劳"],
        "laos": ["老师"],
        "laoshi": ["老师"],
        "xie": ["谢", "写", "些"],
        "xiexie": ["谢谢"],
        "zai": ["在", "再"],
        "zaijian": ["再见"],
        "zh": ["中", "这", "只", "知道", "中国", "者", "主"],
        "zho": ["中", "中国", "周", "重要"],
        "zhong": ["中", "中国", "钟"],
        "zhongg": ["中国"],
        "zhongguo": ["中国"],
        "m": ["我", "门", "吗", "美", "妈", "买", "慢"],
        "me": ["美", "们", "么"],
        "mei": ["美", "没", "每"],
        "meiguo": ["美国"],
        "h": ["好", "汉", "话", "很", "和", "会", "后"],
        "ha": ["哈", "孩", "海"],
        "hao": ["好"],
        "han": ["汉", "汗"],
        "hanyu": ["汉语"],
        "p": ["普通话", "朋", "票", "片", "旁"],
        "pu": ["普通"],
        "putong": ["普通"],
        "putonghua": ["普通话"],
        "peng": ["朋"],
        "pengyou": ["朋友"],
        "w": ["我", "问", "晚", "外", "完", "万"],
        "wo": ["我"],
        "s": ["是", "十", "时", "水", "说", "书", "生", "学校"],
        "sh": ["是", "十", "时", "说", "书", "学生", "学校", "睡觉"],
        "shi": ["是", "十", "时", "事", "室", "识"],
        "x": ["学", "谢", "想", "下", "笑", "西", "心"],
        "xu": ["学", "许", "需"],
        "xue": ["学"],
        "xuesheng": ["学生"],
        "xuexiao": ["学校"],
        "b": ["不", "爸", "杯", "笔", "北", "本", "病"],
        "bu": ["不", "步"],
        "t": ["他", "她", "它", "听", "同", "太", "疼"],
        "ta": ["他", "她", "它"],
        "r": ["人", "日", "肉", "热", "认", "然"],
        "ren": ["人", "认", "任"],
        "d": ["多", "大", "电", "店", "点", "读", "懂"],
        "du": ["多", "读", "度"],
        "duo": ["多", "朵"],
        "duoshao": ["多少"],
        "q": ["钱", "请", "去", "前", "起", "汽"],
        "qian": ["钱", "前", "千"],
        "ch": ["吃", "车", "出", "长", "常", "场"],
        "chi": ["吃", "迟"],
        "chifan": ["吃饭"]
    };

    function convertPinyin() {
        const input = document.getElementById('pinyinInput').value.toLowerCase().replace(/[\s\d]/g, '').trim();
        const candidatesContainer = document.getElementById('candidates');
        candidatesContainer.innerHTML = '';

        if (!input) return;

        let matches = [];

        // Busca todas las entradas en el diccionario cuyo pinyin empiece con lo que estás escribiendo (ej: "zh" busca "zh", "zho", "zhong", etc.)
        for (let key in pinyinDict) {
            if (key.startsWith(input)) {
                matches = matches.concat(pinyinDict[key]);
            }
        }

        // Eliminar duplicados para que la lista sea limpia
        matches = [...new Set(matches)];

        // Si no encuentra coincidencia exacta por prefijo, muestra sugerencias generales o avisa
        if (matches.length === 0) {
            candidatesContainer.innerHTML = '<span style="font-size:12px; color:#aaa; padding:5px;">Nenhum caractere encontrado para este Pinyin.</span>';
            return;
        }

        // Renderiza cada candidato Hanzi en pantalla
        matches.forEach(char => {
            const item = document.createElement('span');
            item.className = 'candidate-item';
            item.innerText = char;
            item.onclick = () => selectHanzi(char);
            candidatesContainer.appendChild(item);
        });
    }

    function selectHanzi(char) {
        const notes = document.getElementById('shared-notes');
        // Inserta cada Hanzi seleccionado uno debajo del otro verticalmente
        if (notes.value.trim() === "") {
            notes.value = char;
        } else {
            notes.value += "\n" + char;
        }
        syncNotes();
        document.getElementById('pinyinInput').value = '';
        document.getElementById('candidates').innerHTML = '';
        document.getElementById('pinyinInput').focus();
    }

    function syncNotes() {
        const text = document.getElementById('shared-notes').value;
        sync(text, 'notes');
    }

    function copyNotes() {
        const notes = document.getElementById('shared-notes');
        notes.select();
        navigator.clipboard.writeText(notes.value).then(() => {
            const btn = document.querySelector('.copy-btn');
            btn.innerText = "Copiado!";
            setTimeout(() => { btn.innerText = "Copiar"; }, 1500);
        });
    }
</script>
</body>
</html>
