<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whereby Mandarin Captions</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #3b82f6;
      --accent-active: #ef4444;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    button {
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: var(--accent-color);
      color: white;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    button.recording {
      background-color: var(--accent-active);
    }

    .shortcut-hint {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    kbd {
      background-color: #334155;
      padding: 3px 6px;
      border-radius: 4px;
      border: 1px solid #475569;
      font-family: monospace;
      color: #fff;
    }

    main {
      flex: 1;
      background-color: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      padding: 30px;
      overflow-y: auto;
      font-size: 2.5rem;
      line-height: 1.8;
      letter-spacing: 1px;
    }

    .interim {
      color: #64748b;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #64748b;
      display: inline-block;
      margin-right: 8px;
    }

    .status-dot.active {
      background-color: #22c55e;
      box-shadow: 0 0 10px #22c55e;
    }
  </style>
</head>
<body>

  <header>
    <div style="display: flex; align-items: center;">
      <span id="statusDot" class="status-dot"></span>
      <h1 style="font-size: 1.25rem; font-weight: 500;">Whereby Hanzi Captions (yfiworkshop)</h1>
    </div>
    <div class="controls">
      <button id="toggleBtn">Iniciar [Espacio]</button>
      <span class="shortcut-hint">Atajo: <kbd>Espacio</kbd></span>
    </div>
  </header>

  <main id="captionContainer">
    <span id="finalTranscript"></span>
    <span id="interimTranscript" class="interim"></span>
  </main>

  <script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      alert("Tu navegador no soporta Web Speech API. Usa Google Chrome o Microsoft Edge.");
    } else {
      const recognition = new SpeechRecognition();
      recognition.lang = 'zh-CN';
      recognition.continuous = true;
      recognition.interimResults = true;

      let isListening = false;

      const toggleBtn = document.getElementById('toggleBtn');
      const statusDot = document.getElementById('statusDot');
      const finalTranscript = document.getElementById('finalTranscript');
      const interimTranscript = document.getElementById('interimTranscript');
      const captionContainer = document.getElementById('captionContainer');

      function toggleListening() {
        if (isListening) {
          recognition.stop();
        } else {
          try {
            recognition.start();
          } catch (err) {
            console.error(err);
          }
        }
      }

      recognition.onstart = () => {
        isListening = true;
        toggleBtn.textContent = 'Detener [Espacio]';
        toggleBtn.classList.add('recording');
        statusDot.classList.add('active');
      };

      recognition.onend = () => {
        isListening = false;
        toggleBtn.textContent = 'Iniciar [Espacio]';
        toggleBtn.classList.remove('recording');
        statusDot.classList.remove('active');
      };

      recognition.onresult = (event) => {
        let interimText = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTranscript.innerHTML += event.results[i][0].transcript + ' ';
          } else {
            interimText += event.results[i][0].transcript;
          }
        }

        interimTranscript.innerHTML = interimText;
        captionContainer.scrollTop = captionContainer.scrollHeight;
      };

      recognition.onerror = (event) => {
        console.error("Error de reconocimiento:", event.error);
      };

      toggleBtn.addEventListener('click', toggleListening);

      // Atajo con la barra espaciadora
      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.code === 'Space') {
          e.preventDefault();
          toggleListening();
        }
      });
    }
  </script>
</body>
</html>
