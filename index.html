<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandarin Room - You First Idiomas</title>
    <style>
        :root {
            --bg-dark: #0f0112;
            --panel-bg: #1a011f;
            --accent-yellow: #fff176; /* Amarillo claro solicitado */
            --mirror: #af8b4a;
            --danger-red: #ef4444;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg-dark); color: white; 
            font-family: 'Segoe UI', Tahoma, "PingFang SC", "Microsoft YaHei", sans-serif; overflow: hidden; 
        }

        .app-container { 
            display: grid; grid-template-rows: 1fr 220px; 
            height: 100vh; width: 100vw; 
        }

        /* Área de Video sin Tags */
        .video-wrapper { position: relative; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }

        /* Panel de Herramientas inferior */
        .tools-panel { 
            background: var(--panel-bg); border-top: 2px solid #333; 
            display: grid; grid-template-columns: 2fr 1fr; 
            gap: 15px; padding: 15px; box-sizing: border-box; 
        }

        .chat-container { 
            background: rgba(255,255,255,0.03); border-radius: 10px; 
            display: flex; flex-direction: column; overflow: hidden; 
            border: 1px solid #333; position: relative; 
        }

        /* Barra Superior de Control dentro del Chat */
        .control-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid #333;
        }

        .status-tag {
            font-size: 11px;
            color: #aaa;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #666;
            display: inline-block;
        }

        .status-dot.active {
            background-color: #22c55e;
            box-shadow: 0 0 6px #22c55e;
        }

        /* Botón Activar / Desactivar con Shortcut */
        #toggle-mic-btn {
            background: var(--accent-yellow);
            border: 1px solid var(--accent-yellow);
            color: #000;
            font-weight: bold;
            font-size: 11px;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }

        #toggle-mic-btn.recording {
            background: var(--danger-red);
            border-color: var(--danger-red);
            color: #ffffff;
        }

        #scroll-area { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .phrase-row { font-size: 24px; line-height: 1.4; letter-spacing: 1px; }
        .local { color: #ffffff; }
        .interim-text { color: #888888; font-style: italic; }

        .word-span { padding: 2px 1px; border-radius: 4px; }

        /* Panel Lateral Informativo */
        .dict-container { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 15px; border: 1px solid #333; overflow-y: auto; }
        .dict-header { 
            color: var(--accent-yellow); font-weight: bold; font-size: 14px; 
            text-transform: uppercase; margin-bottom: 10px; border-bottom: 1px solid #444; 
        }
        #dict-word { font-size: 22px; margin-bottom: 10px; color: var(--accent-yellow); }
        .shortcut-card { font-size: 13px; color: #ccc; line-height: 1.6; }
        kbd {
            background-color: #333;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #555;
            font-family: monospace;
            color: var(--accent-yellow);
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Área de Video con el nuevo link de Whereby -->
    <div class="video-wrapper">
        <iframe src="https://whereby.com/yfiworkshop" allow="camera; microphone; fullscreen; speaker; display-capture" allowfullscreen></iframe>
    </div>

    <!-- Panel de Herramientas -->
    <div class="tools-panel">
        <div class="chat-container">
            <div class="control-bar">
                <div class="status-tag">
                    <span id="statusDot" class="status-dot"></span>
                    <span id="statusText">DESACTIVADO</span>
                </div>
                <button id="toggle-mic-btn" onclick="toggleListening()">ACTIVAR [ESPACIO]</button>
            </div>

            <div id="scroll-area">
                <div id="init-msg" style="color: var(--accent-yellow); font-size: 14px;">Presiona el botón o <kbd>Espacio</kbd> para activar los subtítulos en Chino Mandarín...</div>
                <div id="caption-output" class="phrase-row local"></div>
            </div>
        </div>

        <div class="dict-container">
            <div class="dict-header">Control de Voz</div>
            <div id="dict-word">CHINO MANDARÍN</div>
            <div class="shortcut-card">
                <p>• <strong>Idioma:</strong> 普通话 (zh-CN)</p>
                <p>• <strong>Atajo rápido:</strong> Presiona <kbd>Espacio</kbd> para iniciar o pausar la captura.</p>
                <p>• <strong>Salida:</strong> Caracteres Hanzi en tiempo real.</p>
            </div>
        </div>
    </div>
</div>

<script>
    const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;

    const toggleBtn = document.getElementById('toggle-mic-btn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const captionOutput = document.getElementById('caption-output');
    const scrollArea = document.getElementById('scroll-area');
    const initMsg = document.getElementById('init-msg');

    if (!Speech) {
        alert("Tu navegador no soporta reconocimiento de voz. Te recomendamos usar Google Chrome o Microsoft Edge.");
    } else {
        recognition = new Speech();
        recognition.lang = 'zh-CN';
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onstart = () => {
            isListening = true;
            toggleBtn.innerText = "DETENER [ESPACIO]";
            toggleBtn.classList.add("recording");
            statusDot.classList.add("active");
            statusText.innerText = "ESCUCHANDO...";
            if (initMsg) initMsg.style.display = 'none';
        };

        recognition.onend = () => {
            isListening = false;
            toggleBtn.innerText = "ACTIVAR [ESPACIO]";
            toggleBtn.classList.remove("recording");
            statusDot.classList.remove("active");
            statusText.innerText = "DESACTIVADO";
        };

        recognition.onresult = (e) => {
            let finalTranscript = '';
            let interimTranscript = '';

            for (let i = e.resultIndex; i < e.results.length; ++i) {
                if (e.results[i].isFinal) {
                    finalTranscript += e.results[i][0].transcript;
                } else {
                    interimTranscript += e.results[i][0].transcript;
                }
            }

            if (finalTranscript) {
                const row = document.createElement('div');
                row.className = 'phrase-row local';
                row.innerText = finalTranscript;
                scrollArea.appendChild(row);
            }

            // Mostrar el texto temporal que se va procesando en vivo
            let interimRow = document.getElementById('interim-row');
            if (!interimRow) {
                interimRow = document.createElement('div');
                interimRow.id = 'interim-row';
                interimRow.className = 'phrase-row interim-text';
                scrollArea.appendChild(interimRow);
            }
            interimRow.innerText = interimTranscript;

            scrollArea.scrollTop = scrollArea.scrollHeight;
        };

        recognition.onerror = (event) => {
            console.error("Error en Speech Recognition:", event.error);
        };
    }

    function toggleListening() {
        if (!recognition) return;
        if (isListening) {
            recognition.stop();
        } else {
            try {
                recognition.start();
            } catch (err) {
                console.error(err);
            }
        }
    }

    // Atajo de Teclado con Barra Espaciadora
    document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.code === 'Space') {
            e.preventDefault(); // Evita scroll de la ventana
            toggleListening();
        }
    });
</script>
</body>
</html>
