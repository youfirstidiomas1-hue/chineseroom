<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirroring Room - Chinese Fast</title>
    <style>
        :root {
            --bg-dark: #0f0112;
            --panel-bg: #1a011f;
            --accent-yellow: #fff176; 
            --mirror-gold: #af8b4a;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg-dark); color: white; 
            font-family: 'PingFang SC', sans-serif; overflow: hidden; 
        }

        .app-container { display: grid; grid-template-rows: 1fr 220px; height: 100vh; }

        .video-wrapper { position: relative; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }

        .tools-panel { 
            background: var(--panel-bg); border-top: 2px solid #333; 
            display: grid; grid-template-columns: 2fr 1fr; gap: 10px; padding: 15px; 
        }

        .chat-container { 
            background: rgba(255,255,255,0.03); border-radius: 10px; 
            display: flex; flex-direction: column; overflow-y: auto; border: 1px solid #333;
            padding: 10px;
        }

        .phrase-row { font-size: 24px; margin-bottom: 10px; line-height: 1.4; }
        .local { color: #ffffff; } /* Tus palabras */
        .remote { color: var(--mirror-gold); border-left: 3px solid var(--mirror-gold); padding-left: 10px; } /* Palabras del otro */

        .word-span { cursor: pointer; padding: 0 2px; border-radius: 4px; }
        .word-span:hover { background: var(--accent-yellow); color: #000; }

        .dict-container { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 15px; border: 1px solid #444; }
        .dict-header { color: var(--accent-yellow); font-size: 12px; font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid #444; }
        #dict-word { font-size: 40px; color: #fff; margin-bottom: 5px; }
        #dict-results { font-size: 18px; color: var(--accent-yellow); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="video-wrapper">
        <iframe src="https://whereby.com/coachlaura7" allow="camera; microphone; fullscreen; speaker; display-capture"></iframe>
    </div>

    <div class="tools-panel">
        <div class="chat-container" id="scroll-area">
            </div>

        <div class="dict-container">
            <div class="dict-header">MIRROR DICTIONARY</div>
            <div id="dict-word">-</div>
            <div id="dict-results">Select a character</div>
        </div>
    </div>
</div>

<script>
    const DB_URL = "https://chat-tool-d26fd-default-rtdb.firebaseio.com/live_session.json";
    const myID = "USER_" + Math.random().toString(36).substring(7);
    let lastTimestamp = 0;

    // --- 1. SINCRONIZACIÓN (MIRRORING) ---
    async function sendToFirebase(text, type, extra = null) {
        const payload = { text, type, sender: myID, timestamp: Date.now(), extra };
        try {
            await fetch(DB_URL, { method: 'PATCH', body: JSON.stringify({ "lastEvent": payload }) });
        } catch (e) { console.error("Firebase Sync Error"); }
    }

    // Escuchar cambios de Firebase (Mirroring)
    setInterval(async () => {
        try {
            const res = await fetch(DB_URL);
            const data = await res.json();
            if (data?.lastEvent && data.lastEvent.timestamp > lastTimestamp) {
                const ev = data.lastEvent;
                lastTimestamp = ev.timestamp;
                
                if (ev.sender !== myID) {
                    // Si el evento es de la otra persona, renderizar en pantalla
                    if (ev.type === 'phrase') renderPhrase(ev.text, 'remote');
                    if (ev.type === 'analysis') updateUI(ev.text, ev.extra);
                }
            }
        } catch (e) {}
    }, 800);

    // --- 2. RENDERIZADO ---
    function renderPhrase(text, mode) {
        const area = document.getElementById('scroll-area');
        const row = document.createElement('div');
        row.className = `phrase-row ${mode}`;
        
        text.split("").forEach(char => {
            const span = document.createElement('span');
            span.className = 'word-span';
            span.innerText = char;
            span.onclick = () => handleIdentify(char);
            row.appendChild(span);
        });
        
        area.appendChild(row);
        area.scrollTop = area.scrollHeight;
    }

    // --- 3. TRADUCCIÓN Y ANÁLISIS ---
    async function handleIdentify(char) {
        // Mostrar localmente de inmediato
        updateUI(char, "Searching...");
        
        try {
            const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(char)}&langpair=zh-CN|en`);
            const data = await res.json();
            const meaning = data.responseData.translatedText.toLowerCase();
            
            // Actualizar mi pantalla y enviar a Firebase para el mirroring
            updateUI(char, meaning);
            sendToFirebase(char, 'analysis', meaning);
        } catch (e) {
            updateUI(char, "Error");
        }
    }

    function updateUI(word, result) {
        document.getElementById('dict-word').innerText = word;
        document.getElementById('dict-results').innerText = result;
    }

    // --- 4. VOZ A TEXTO (ULTRA RÁPIDO) ---
    function startSpeech() {
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Speech) return;
        
        const rec = new Speech();
        rec.lang = 'zh-CN';
        rec.continuous = true;
        rec.interimResults = false; // Cambiado a false para evitar spam de Firebase, pero procesado rápido

        rec.onresult = (e) => {
            const transcript = e.results[e.results.length - 1][0].transcript.trim();
            if (transcript) {
                // 1. Mostrar en mi pantalla inmediatamente
                renderPhrase(transcript, 'local');
                // 2. Enviar a Firebase para el mirroring
                sendToFirebase(transcript, 'phrase');
            }
        };

        rec.onend = () => rec.start();
        rec.start();
    }

    startSpeech();
</script>
</body>
</html>
