<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英语课室 - You First Idiomas</title>
    <style>
        :root {
            --bg-dark: #0f0112;
            --panel-bg: #1a011f;
            --accent-yellow: #fff176; 
            --mirror: #af8b4a;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg-dark); color: white; 
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; overflow: hidden; 
        }

        .app-container { 
            display: grid; grid-template-rows: 1fr 220px; 
            height: 100vh; width: 100vw; 
        }

        .video-wrapper { position: relative; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }

        .tools-panel { 
            background: var(--panel-bg); border-top: 2px solid #333; 
            display: grid; grid-template-columns: 2fr 1fr; 
            gap: 15px; padding: 15px; box-sizing: border-box; 
        }

        .chat-container { 
            background: rgba(255,255,255,0.03); border-radius: 10px; 
            display: flex; flex-direction: column; overflow: hidden; 
            border: 1px solid #333; position: relative; 
        }

        #freeze-btn {
            position: absolute; top: 10px; right: 10px; z-index: 10;
            background: rgba(255,255,255,0.1); border: 1px solid #444;
            color: #ccc; font-size: 11px; padding: 4px 8px; border-radius: 4px;
            cursor: pointer; transition: 0.3s;
        }
        #freeze-btn.active { background: var(--accent-yellow); color: #000; border-color: var(--accent-yellow); }

        #scroll-area { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .phrase-row { font-size: 22px; line-height: 1.6; letter-spacing: 2px; }
        .local { color: #ffffff; }
        .remote { color: var(--mirror); border-left: 3px solid var(--mirror); padding-left: 10px; }
        
        .word-span { cursor: pointer; padding: 0 2px; border-radius: 4px; transition: 0.2s; }
        .word-span:hover { background: rgba(255, 241, 118, 0.2); color: var(--accent-yellow); }

        .dict-container { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 15px; border: 1px solid #333; overflow-y: auto; }
        .dict-header { color: var(--accent-yellow); font-weight: bold; font-size: 12px; text-transform: uppercase; margin-bottom: 10px; border-bottom: 1px solid #444; padding-bottom: 5px; }
        #dict-word { font-size: 28px; margin-bottom: 5px; color: var(--accent-yellow); }
        .related-box { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .tag { background: rgba(255, 241, 118, 0.15); color: var(--accent-yellow); padding: 4px 10px; border-radius: 15px; font-size: 13px; border: 1px solid rgba(255,241,118,0.3); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="video-wrapper">
        <iframe src="https://whereby.com/coachlaura7" allow="camera; microphone; fullscreen; speaker; display-capture" allowfullscreen></iframe>
    </div>

    <div class="tools-panel">
        <div class="chat-container">
            <button id="freeze-btn" onclick="toggleFreeze()">锁定文本</button>
            <div id="scroll-area">
                <div id="init-msg" style="color: var(--accent-yellow); font-size: 14px;">麦克风已激活。等待语音输入...</div>
            </div>
        </div>

        <div class="dict-container">
            <div class="dict-header">相关词义 (Related Meanings)</div>
            <div id="dict-word">...</div>
            <div id="dict-results" class="related-box">点击上方汉字查看关联释义。</div>
        </div>
    </div>
</div>

<script>
    const DB_URL = "https://chat-tool-d26fd-default-rtdb.firebaseio.com/live_session.json";
    const myID = "USER_" + Math.random().toString(36).substring(7);
    let lastTimestamp = 0;
    let isFrozen = false;

    function toggleFreeze() {
        isFrozen = !isFrozen;
        const btn = document.getElementById('freeze-btn');
        btn.innerText = isFrozen ? "取消锁定" : "锁定文本";
        btn.className = isFrozen ? "active" : "";
    }

    async function sync(text, type, extra = null) {
        if (isFrozen && type === 'phrase') return;
        const payload = { text, type, sender: myID, timestamp: Date.now(), extra };
        try {
            await fetch(DB_URL, { method: 'PATCH', body: JSON.stringify({ "lastEvent": payload }) });
            render(payload, false);
        } catch (e) {}
    }

    setInterval(async () => {
        try {
            const res = await fetch(DB_URL);
            const data = await res.json();
            if (data?.lastEvent) {
                const ev = data.lastEvent;
                if (ev.timestamp > lastTimestamp && ev.sender !== myID) {
                    lastTimestamp = ev.timestamp;
                    if (!isFrozen || ev.type !== 'phrase') render(ev, true);
                }
            }
        } catch (e) {}
    }, 1500);

    function render(data, isRemote) {
        if (data.type === 'phrase') {
            const row = document.createElement('div');
            row.className = `phrase-row ${isRemote ? 'remote' : 'local'}`;
            // Segmentación por caracteres para permitir selección precisa
            data.text.split("").forEach(char => {
                if (char.trim() === "") return;
                const span = document.createElement('span');
                span.className = 'word-span';
                span.innerText = char;
                span.onclick = () => lookup(char);
                row.appendChild(span);
            });
            const area = document.getElementById('scroll-area');
            area.appendChild(row);
            area.scrollTop = area.scrollHeight;
            if (document.getElementById('init-msg')) document.getElementById('init-msg').style.display = 'none';
        } else if (data.type === 'analysis') {
            updateDictUI(data.text, data.extra);
        }
    }

    async function lookup(char) {
        try {
            // Utilizamos una consulta de traducción con desglose
            const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(char)}&langpair=zh-CN|en`);
            const data = await res.json();
            
            if (data.responseData) {
                let mainText = data.responseData.translatedText;
                // Limpiamos y separamos por comas o puntos para crear los "Related Meanings"
                let meanings = mainText.split(/[,.;/]+/).map(s => s.trim().toLowerCase());
                // Eliminamos duplicados
                meanings = [...new Set(meanings)];
                
                sync(char, 'analysis', meanings);
            }
        } catch (e) {}
    }

    function updateDictUI(word, meanings) {
        document.getElementById('dict-word').innerText = word;
        const container = document.getElementById('dict-results');
        container.innerHTML = meanings.map(m => `<div class="tag">${m}</div>`).join('');
    }

    function startSpeech() {
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Speech) return;
        const rec = new Speech();
        rec.lang = 'zh-CN';
        rec.continuous = true;
        rec.onresult = (e) => {
            if (!isFrozen) {
                const text = e.results[e.results.length - 1][0].transcript.trim();
                sync(text, 'phrase');
            }
        };
        rec.onend = () => rec.start();
        rec.start();
    }

    startSpeech();
</script>
</body>
</html>
